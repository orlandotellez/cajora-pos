name: Build CajoraPOS para Windows

# Se dispara a mano desde la pestaña Actions de GitHub.
# El .exe de Windows solo puede compilarse en un runner Windows:
# desde Linux Tauri genera únicamente los bundles de Linux.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri (Windows)
        run: bun tauri build

      - name: Upload instaladores
        uses: actions/upload-artifact@v4
        with:
          name: CajoraPOS-windows
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
